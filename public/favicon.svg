<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="kani.lk">
  <rect width="64" height="64" rx="14" fill="#12452F"/>
  <!-- palmyra-gold roofline, echoing the mark -->
  <path d="M14 30 L26 20 L38 30" fill="none" stroke="#BE9B4E" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- paddy furrows sweeping to the horizon -->
  <path d="M12 46 C22 40 32 38 46 37" fill="none" stroke="#4E9A51" stroke-width="3"
        stroke-linecap="round"/>
  <path d="M14 52 C26 46 36 44 50 43" fill="none" stroke="#BE9B4E" stroke-width="2.6"
        stroke-linecap="round" opacity="0.9"/>
  <!-- the K -->
  <g fill="#F6F5F1">
    <rect x="40" y="14" width="5.2" height="30" rx="1.4"/>
    <path d="M45.6 29.5 L56 14 L61.4 14 L50.4 30 Z"/>
    <path d="M45.6 28.5 L57 44 L51.4 44 L45.6 35 Z"/>
  </g>
</svg>
