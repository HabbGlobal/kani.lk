name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.CI_MONGODB_URI }}
          JWT_SECRET: placeholder-build-only-secret
          JWT_REFRESH_SECRET: placeholder-build-only-refresh-secret
          NEXT_PUBLIC_SITE_URL: https://kani.lk

  deploy:
    needs: typecheck-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            cd ~/kani.lk

            echo "Pulling latest main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building application..."
            npm run build

            # `pm2 restart` fails outright when the process is not registered
            # yet, which is every first deploy to a fresh VPS. Start it in that
            # case instead, then persist the list so it survives a reboot.
            echo "Restarting application..."
            if pm2 describe kani > /dev/null 2>&1; then
              pm2 restart kani --update-env
            else
              pm2 start npm --name kani -- start
            fi
            pm2 save

            echo "Deployment completed successfully."