name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.CI_MONGODB_URI }}
          JWT_SECRET: placeholder-build-only-secret
          JWT_REFRESH_SECRET: placeholder-build-only-refresh-secret
          NEXT_PUBLIC_SITE_URL: https://kani.lk

  deploy:
    needs: typecheck-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            cd ~/kani.lk

            echo "Pulling latest main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building application..."
            npm run build

            # The VPS runs several apps under one PM2 account, each named
            # <app>-<port>. This one is kani-3008 and Nginx proxies to that
            # port, so the name must match exactly — starting a differently
            # named process would leave the real site running the old build.
            echo "Restarting application..."
            pm2 restart kani-3008 --update-env

            echo "Deployment completed successfully."